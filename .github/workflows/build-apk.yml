name: Build SCHAT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Schat_Social_1.1_Online_Backend.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract SCHAT project
        run: unzip -q Schat_Social_1.1_Online_Backend.zip -d source

      - name: Build debug APK
        working-directory: source/ZanceChatSatelliteV4
        run: gradle assembleDebug

      - name: Upload SCHAT APK
        uses: actions/upload-artifact@v4
        with:
          name: SCHAT-Android-APK
          path: source/ZanceChatSatelliteV4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
